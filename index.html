<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بوابة نتيجة الثانوية العامة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --maroon-900:#3B0F1A;
    --maroon-700:#5A1826;
    --gold-500:#B8892B;
    --gold-300:#D9B36F;
    --cream-50:#F6EFDD;
    --cream-100:#EFE4C8;
    --ink-800:#241512;
    --ink-500:#5B4A42;
    --green-600:#2F6B4F;
    --green-100:#E1EEE6;
    --amber-600:#9C6B1E;
    --amber-100:#F1E4C4;
    --red-600:#9B3A34;
    --red-100:#F3E1DF;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--cream-50);
    color:var(--ink-800);
    font-family:'Tajawal',sans-serif;
    min-height:100vh;
  }
  .top-band{
    background:
      radial-gradient(1200px 400px at 50% -200px, var(--maroon-700), var(--maroon-900) 70%);
    color:var(--cream-50);
    padding:56px 20px 80px;
    position:relative;
    overflow:hidden;
  }
  .top-band::after{
    content:"";
    position:absolute; left:0; right:0; bottom:0; height:10px;
    background-image:
      linear-gradient(135deg, var(--gold-500) 25%, transparent 25%),
      linear-gradient(225deg, var(--gold-500) 25%, transparent 25%),
      linear-gradient(45deg, var(--gold-500) 25%, transparent 25%),
      linear-gradient(315deg, var(--gold-500) 25%, transparent 25%);
    background-position: 10px 0, 10px 0, 0 0, 0 0;
    background-size: 20px 20px;
    background-repeat: repeat-x;
    opacity:.85;
  }
  .brand{
    max-width:760px;
    margin:0 auto;
    text-align:center;
  }
  .brand .eyebrow{
    display:inline-flex; align-items:center; gap:8px;
    font-size:13px; letter-spacing:.5px; color:var(--gold-300, #E8CE8E);
    background:rgba(255,255,255,.06);
    border:1px solid rgba(216,178,110,.4);
    padding:6px 16px; border-radius:999px;
    margin-bottom:22px;
  }
  .brand h1{
    font-family:'Aref Ruqaa', serif;
    font-weight:700;
    font-size:44px;
    margin:0 0 10px;
    line-height:1.3;
  }
  .brand p.sub{
    color:#DCCDBF;
    font-size:15px;
    margin:0 0 34px;
  }

  .search-card{
    max-width:640px;
    margin:-56px auto 0;
    background:var(--cream-50);
    border:1px solid var(--cream-100);
    border-radius:18px;
    box-shadow:0 30px 60px -20px rgba(59,15,26,.35), 0 2px 0 rgba(184,137,43,.25) inset;
    padding:26px;
    position:relative;
    z-index:2;
  }
  .tabs{
    display:flex;
    background:var(--cream-100);
    border-radius:12px;
    padding:4px;
    margin-bottom:18px;
    gap:4px;
  }
  .tab{
    flex:1;
    text-align:center;
    padding:10px 8px;
    border-radius:9px;
    font-weight:700;
    font-size:14px;
    cursor:pointer;
    color:var(--ink-500);
    transition:background .2s, color .2s;
    user-select:none;
  }
  .tab.active{
    background:var(--maroon-900);
    color:var(--cream-50);
  }
  .field{
    display:flex;
    gap:10px;
  }
  input[type=text], input[type=tel]{
    flex:1;
    border:1.5px solid var(--cream-100);
    background:#fff;
    padding:14px 16px;
    border-radius:12px;
    font-family:'Tajawal',sans-serif;
    font-size:16px;
    color:var(--ink-800);
    outline:none;
    transition:border-color .2s;
  }
  input[type=text]:focus, input[type=tel]:focus{
    border-color:var(--gold-500);
  }
  button.go{
    background:var(--maroon-900);
    color:var(--cream-50);
    border:none;
    padding:0 24px;
    border-radius:12px;
    font-family:'Tajawal',sans-serif;
    font-weight:700;
    font-size:15px;
    cursor:pointer;
    transition:background .2s, transform .05s;
  }
  button.go:hover{ background:var(--maroon-700); }
  button.go:active{ transform:scale(.97); }
  button.go:disabled{ opacity:.5; cursor:not-allowed; }
  .hint{ font-size:12px; color:var(--ink-500); margin:10px 4px 0; }

  .status-line{
    max-width:640px;
    margin:18px auto;
    text-align:center;
    font-size:14px;
    color:var(--ink-500);
  }
  .progress-wrap{
    max-width:420px;
    margin:14px auto 0;
    background:var(--cream-100);
    border-radius:999px;
    height:8px;
    overflow:hidden;
  }
  .progress-bar{
    height:100%;
    width:0%;
    background:linear-gradient(90deg, var(--gold-500), var(--maroon-700));
    transition:width .2s ease;
  }

  .results-area{
    max-width:640px;
    margin:0 auto 80px;
    padding:0 20px;
  }

  .name-results{
    background:#fff;
    border:1px solid var(--cream-100);
    border-radius:14px;
    overflow:hidden;
    margin-top:6px;
  }
  .name-result-row{
    padding:14px 18px;
    border-bottom:1px solid var(--cream-100);
    cursor:pointer;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    transition:background .15s;
  }
  .name-result-row:last-child{ border-bottom:none; }
  .name-result-row:hover{ background:var(--cream-50); }
  .name-result-row .n{ font-weight:700; }
  .name-result-row .s{ font-size:13px; color:var(--ink-500); direction:ltr; }

  .result-card{
    background:#fff;
    border:1px solid var(--cream-100);
    border-radius:20px;
    padding:32px 26px;
    text-align:center;
    box-shadow:0 20px 40px -24px rgba(59,15,26,.3);
    animation:riseIn .45s ease both;
  }
  @keyframes riseIn{
    from{opacity:0; transform:translateY(14px);}
    to{opacity:1; transform:translateY(0);}
  }

  .seal{
    width:108px; height:108px;
    margin:0 auto 18px;
    animation:stampIn .5s cubic-bezier(.2,1.4,.4,1) both;
  }
  @keyframes stampIn{
    0%{ opacity:0; transform:scale(1.8) rotate(-14deg); }
    60%{ opacity:1; }
    100%{ opacity:1; transform:scale(1) rotate(0deg); }
  }

  .result-name{
    font-family:'Aref Ruqaa', serif;
    font-size:26px;
    font-weight:700;
    margin:4px 0 2px;
  }
  .result-seating{
    color:var(--ink-500);
    font-size:14px;
    direction:ltr;
    display:inline-block;
    margin-bottom:20px;
  }
  .stat-row{
    display:flex;
    justify-content:center;
    gap:14px;
    flex-wrap:wrap;
    margin-top:6px;
  }
  .stat-box{
    background:var(--cream-50);
    border:1px solid var(--cream-100);
    border-radius:14px;
    padding:14px 22px;
    min-width:130px;
  }
  .stat-box .label{ font-size:12px; color:var(--ink-500); margin-bottom:4px; }
  .stat-box .value{ font-size:22px; font-weight:900; direction:ltr; }
  .status-pill{
    display:inline-block;
    margin-top:18px;
    padding:8px 20px;
    border-radius:999px;
    font-weight:700;
    font-size:14px;
  }
  .status-0{ background:var(--green-100); color:var(--green-600); }
  .status-1{ background:var(--amber-100); color:var(--amber-600); }
  .status-2{ background:var(--red-100); color:var(--red-600); }
  .status-3{ background:var(--red-100); color:var(--red-600); }

  .empty-note{
    text-align:center;
    color:var(--ink-500);
    padding:30px 10px;
    font-size:14px;
  }

  footer{
    text-align:center;
    font-size:12px;
    color:var(--ink-500);
    padding:20px;
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:.001ms !important; }
  }

  @media (max-width:480px){
    .brand h1{ font-size:32px; }
    .search-card{ margin:-40px 14px 0; padding:20px; }
    .field{ flex-direction:column; }
    button.go{ padding:14px; }
  }
</style>
</head>
<body>

<div class="top-band">
  <div class="brand">
    <span class="eyebrow">دور أول ٢٠٢٦ · نظام حديث</span>
    <h1>بوابة نتيجة الثانوية العامة</h1>
    <p class="sub">استعلم عن نتيجتك برقم الجلوس أو بالاسم</p>
  </div>
</div>

<div class="search-card">
  <div class="tabs">
    <div class="tab active" data-mode="seating">رقم الجلوس</div>
    <div class="tab" data-mode="name">الاسم</div>
  </div>
  <div class="field">
    <input id="q" type="tel" inputmode="numeric" placeholder="اكتب رقم الجلوس" />
    <button id="go" class="go">بحث</button>
  </div>
 
</div>

<div class="status-line" id="statusLine">
  جاري تجهيز قاعدة البيانات…
  <div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>
</div>

<div class="results-area" id="resultsArea"></div>

<footer>البيانات مأخوذة من ملف النتيجة الرسمي المرفوع لهذا الموقع. للاستخدام الشخصي فقط.</footer>

<script src="https://cdn.jsdelivr.net/npm/sql.js@1.14.1/dist/sql-wasm.js"></script>
<script>
const STATUS_LABELS = ["ناجح دور أول","دور ثان","راسب دور أول","غياب كلى دور أول"];
let db = null;
let mode = "seating";

const qInput = document.getElementById('q');
const goBtn = document.getElementById('go');
const hint = document.getElementById('hint');
const statusLine = document.getElementById('statusLine');
const progressBar = document.getElementById('progressBar');
const resultsArea = document.getElementById('resultsArea');
const tabs = document.querySelectorAll('.tab');

tabs.forEach(t => t.addEventListener('click', () => {
  tabs.forEach(x => x.classList.remove('active'));
  t.classList.add('active');
  mode = t.dataset.mode;
  if(mode === 'seating'){
    qInput.type = 'tel';
    qInput.inputMode = 'numeric';
    qInput.placeholder = 'اكتب رقم الجلوس';
    hint.textContent = 'مثال: 2001970';
  } else {
    qInput.type = 'text';
    qInput.inputMode = 'text';
    qInput.placeholder = 'اكتب الاسم كامل أو جزء منه';
    
  }
  qInput.value = '';
  resultsArea.innerHTML = '';
}));

qInput.addEventListener('keydown', e => { if(e.key === 'Enter') doSearch(); });
goBtn.addEventListener('click', doSearch);

async function loadDb(){
  try{
    const resp = await fetch('results.db.gz');
    if(!resp.ok) throw new Error('تعذر تحميل ملف البيانات');
    const total = parseInt(resp.headers.get('Content-Length') || '0', 10);
    let loaded = 0;
    const reader = resp.body.getReader();
    const chunks = [];
    while(true){
      const {done, value} = await reader.read();
      if(done) break;
      chunks.push(value);
      loaded += value.length;
      if(total){
        progressBar.style.width = Math.min(100, (loaded/total*100)).toFixed(0) + '%';
      }
    }
    const gzBlob = new Blob(chunks);
    const ds = new DecompressionStream('gzip');
    const decompressedStream = gzBlob.stream().pipeThrough(ds);
    const buf = await new Response(decompressedStream).arrayBuffer();

    const SQL = await initSqlJs({ locateFile: f => `https://cdn.jsdelivr.net/npm/sql.js@1.14.1/dist/${f}` });
    db = new SQL.Database(new Uint8Array(buf));

    statusLine.style.display = 'none';
    goBtn.disabled = false;
  }catch(err){
    statusLine.innerHTML = 'حدث خطأ أثناء تحميل قاعدة البيانات. تأكد من اتصال الإنترنت وحاول تحديث الصفحة.';
    console.error(err);
  }
}
goBtn.disabled = true;
loadDb();

function doSearch(){
  if(!db) return;
  const val = qInput.value.trim();
  resultsArea.innerHTML = '';
  if(!val) return;

  if(mode === 'name'){
    resultsArea.innerHTML = '<div class="empty-note">جاري البحث…</div>';
    setTimeout(() => runSearch(val), 10);
    return;
  }
  runSearch(val);
}

function runSearch(val){
  resultsArea.innerHTML = '';
  if(mode === 'seating'){
    const num = parseInt(val.replace(/[^\d]/g,''), 10);
    if(isNaN(num)){
      resultsArea.innerHTML = '<div class="empty-note">اكتب رقم جلوس صحيح</div>';
      return;
    }
    const stmt = db.prepare("SELECT seating_no, name, total_degree, status FROM students WHERE seating_no = ?");
    stmt.bind([num]);
    if(stmt.step()){
      renderResultCard(stmt.getAsObject());
    } else {
      resultsArea.innerHTML = '<div class="empty-note">لا توجد نتيجة بهذا الرقم. تأكد من رقم الجلوس.</div>';
    }
    stmt.free();
  } else {
    const terms = val.split(/\s+/).filter(Boolean);
    if(terms.length === 0) return;
    try{
      const whereClauses = terms.map(() => 'name LIKE ?').join(' AND ');
      const params = terms.map(t => '%' + t + '%');
      const stmt = db.prepare(`
        SELECT seating_no, name, total_degree, status
        FROM students
        WHERE ${whereClauses}
        LIMIT 30
      `);
      stmt.bind(params);
      const rows = [];
      while(stmt.step()) rows.push(stmt.getAsObject());
      stmt.free();

      if(rows.length === 0){
        resultsArea.innerHTML = '<div class="empty-note">لا توجد نتائج مطابقة لهذا الاسم.</div>';
      } else if(rows.length === 1){
        renderResultCard(rows[0]);
      } else {
        renderNameList(rows);
      }
    }catch(err){
      resultsArea.innerHTML = '<div class="empty-note">صيغة البحث غير صحيحة، جرّب اسمًا آخر.</div>';
    }
  }
}

function renderNameList(rows){
  const wrap = document.createElement('div');
  wrap.className = 'name-results';
  rows.forEach(r => {
    const row = document.createElement('div');
    row.className = 'name-result-row';
    row.innerHTML = `<span class="n">${escapeHtml(r.name)}</span><span class="s">${r.seating_no}</span>`;
    row.addEventListener('click', () => renderResultCard(r));
    wrap.appendChild(row);
  });
  resultsArea.innerHTML = '';
  resultsArea.appendChild(wrap);
}

function renderResultCard(r){
  const pct = ((r.total_degree/320)*100).toFixed(1);
  const statusIdx = r.status;
  const statusText = STATUS_LABELS[statusIdx] ?? '—';
  const sealColor = statusIdx === 0 ? '#2F6B4F' : (statusIdx === 1 ? '#9C6B1E' : '#9B3A34');
  const sealIcon = statusIdx === 0
    ? '<path d="M27 46l12 12 26-28" stroke="white" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>'
    : (statusIdx === 1
      ? '<text x="50" y="60" font-size="34" fill="white" text-anchor="middle" font-family="Tajawal">٢</text>'
      : '<path d="M32 32l36 36M68 32l-36 36" stroke="white" stroke-width="6" stroke-linecap="round"/>');

  resultsArea.innerHTML = `
    <div class="result-card">
      <svg class="seal" viewBox="0 0 100 100">
        <circle cx="50" cy="50" r="46" fill="${sealColor}"/>
        <circle cx="50" cy="50" r="46" fill="none" stroke="white" stroke-width="2" stroke-dasharray="4 3" opacity=".6"/>
        ${sealIcon}
      </svg>
      <div class="result-name">${escapeHtml(r.name)}</div>
      <div class="result-seating">رقم الجلوس: ${r.seating_no}</div>
      <div class="stat-row">
        <div class="stat-box">
          <div class="label">المجموع</div>
          <div class="value">${r.total_degree} <span style="font-size:13px;color:var(--ink-500)">/ 320</span></div>
        </div>
        <div class="stat-box">
          <div class="label">النسبة المئوية</div>
          <div class="value">${pct}%</div>
        </div>
      </div>
      <div class="status-pill status-${statusIdx}">${statusText}</div>
    </div>
  `;
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
</script>
</body>
</html>
